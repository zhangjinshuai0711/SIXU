name: Fix Chinese glyphs in comparison PNG (one time)

on:
  push:
    paths:
      - ".github/workflows/render-sixu-png-v2.yml"

permissions:
  contents: write

jobs:
  rerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pango-based SVG renderer and Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin fonts-noto-cjk
          fc-cache -f
          fc-match "Noto Sans CJK SC"
      - name: Render corrected source to high-resolution PNG
        run: |
          git show 1d42acb73ea8f91e683c62ab75899ae63a88bf6c:docs/images/instant-vs-sixu-corrected.svg > /tmp/instant-vs-sixu-corrected.svg
          rsvg-convert --format png --width 2400 --height 1560 \
            --output docs/images/instant-vs-sixu-corrected.png \
            /tmp/instant-vs-sixu-corrected.svg
          python - <<'PY'
          from pathlib import Path
          import struct
          path = Path("docs/images/instant-vs-sixu-corrected.png")
          image = path.read_bytes()
          assert image[:8] == b'\x89PNG\r\n\x1a\n', "Invalid PNG"
          assert struct.unpack('>II',image[16:24]) == (2400,1560), "Wrong dimensions"
          print("PNG verified", len(image),"bytes")
          PY
      - name: Replace old PNG and remove one-time workflow
        run: |
          git rm .github/workflows/render-sixu-png-v2.yml
          git add docs/images/instant-vs-sixu-corrected.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: fix CJK font rendering in demo PNG"
          git push origin HEAD:main
