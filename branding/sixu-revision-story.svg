<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="tit desc">
<title id="tit">SIXU reasoning: candidate error, revision, and declared check</title>
<desc id="desc">An illustrative example, not an actual screen recording: an incorrect 497 candidate for 18 times 24 plus 75 is flagged by a declared arithmetic check, corrected to 507, and finalized.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090f28"/><stop offset=".55" stop-color="#171f46"/><stop offset="1" stop-color="#080d25"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4fe6fc"/><stop offset=".5" stop-color="#8f80ff"/><stop offset="1" stop-color="#e891fa"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="1200" height="370" rx="22" fill="url(#bg)"/>
<rect x="22" y="20" width="1156" height="46" rx="15" fill="#1f2d54" stroke="#465f91"/>
<circle cx="46" cy="43" r="6" fill="#52e7dc"/>
<text x="62" y="50" fill="#f2f7ff" font-family="Arial,sans-serif" font-weight="800" font-size="21">SIXU · REVISION IN ACTION</text>
<text x="1129" y="48" text-anchor="end" fill="#9bb6df" font-family="Arial,sans-serif" font-size="14">ILLUSTRATIVE · NOT A LIVE RUN</text>
<g font-family="Arial,sans-serif">
<rect x="28" y="95" width="252" height="194" rx="18" fill="#172d51" stroke="#427bb6" stroke-width="2"/>
<text x="48" y="127" fill="#73eafa" font-size="18" font-weight="800">01 / INPUT</text>
<text x="48" y="180" fill="#fff" font-size="36" font-weight="800">18 × 24 + 75</text>
<text x="48" y="234" fill="#b5cee8" font-size="19">Declared arithmetic</text>
<text x="48" y="258" fill="#b5cee8" font-size="19">check from task</text>
<path d="M286 187H316" stroke="#69cbff" stroke-width="4"/>
<path d="M311 180l10 7-10 7" stroke="#69cbff" stroke-width="3" fill="none"/>
<rect x="324" y="95" width="252" height="194" rx="18" fill="#28233f" stroke="#ef839d" stroke-width="2"/>
<text x="344" y="127" fill="#ff9ebc" font-size="18" font-weight="800">02 / CANDIDATE v1</text>
<text x="344" y="180" fill="#fff" font-size="42" font-weight="800">497</text>
<rect x="344" y="207" width="192" height="42" rx="10" fill="#6a283c"/>
<text x="361" y="236" fill="#ffc1cf" font-size="19" font-weight="800">CHECK FAILED</text>
<path d="M583 187H613" stroke="#69cbff" stroke-width="4"/>
<path d="M608 180l10 7-10 7" stroke="#69cbff" stroke-width="3" fill="none"/>
<rect x="621" y="95" width="252" height="194" rx="18" fill="#25254f" stroke="#b292ff" stroke-width="2"/>
<text x="641" y="127" fill="#d0b4ff" font-size="18" font-weight="800">03 / REVISE v2</text>
<text x="641" y="180" fill="#fff" font-size="42" font-weight="800">507</text>
<text x="641" y="226" fill="#bea8f6" font-size="19">Outdated review</text>
<text x="641" y="251" fill="#bea8f6" font-size="19">cannot be reused</text>
<path d="M881 187H911" stroke="#69cbff" stroke-width="4"/>
<path d="M906 180l10 7-10 7" stroke="#69cbff" stroke-width="3" fill="none"/>
<rect x="918" y="95" width="252" height="194" rx="18" fill="#143c40" stroke="#68e5b7" stroke-width="2"/>
<text x="938" y="127" fill="#83f4c7" font-size="18" font-weight="800">04 / VERIFIED*</text>
<text x="938" y="179" fill="#fff" font-size="42" font-weight="800">507</text>
<rect x="938" y="207" width="190" height="42" rx="10" fill="#195f58"/>
<text x="957" y="236" fill="#baffdc" font-size="19" font-weight="800">CHECK PASSED</text>
</g>
<text x="30" y="324" fill="#b8c9e6" font-family="Arial,sans-serif" font-size="17">* Only when the corresponding structured check is declared, supported and executed.</text>
<text x="30" y="347" fill="#809fc5" font-family="Arial,sans-serif" font-size="15">Conceptual teaching example. Protocol completion does not prove universal correctness.</text>
</svg>