<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">ChatGPT Instant × SIXU — animated reasoning workflow</title>
<desc id="desc">A branded seven-stage conceptual flow with candidates, comparisons, declared checks, revisions and finalization. Stages pulse in order, and a curved arrow shows optional return from REVISE to VERIFY.</desc>
<defs>
<linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070d24"/><stop offset=".58" stop-color="#152044"/><stop offset="1" stop-color="#0b112c"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#48e5fa"/><stop offset=".55" stop-color="#947bff"/><stop offset="1" stop-color="#f187e2"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#4769a0" stroke-opacity=".18" stroke-width=".75"/></pattern>
<radialGradient id="aura"><stop stop-color="#7861f0" stop-opacity=".27"/><stop offset="1" stop-color="#7960f0" stop-opacity="0"/></radialGradient>
<style>
.step-label{fill:#f2f8ff;font-family:Arial,sans-serif;font-size:19px;font-weight:800;text-anchor:middle}
.step-caption{fill:#9fbbde;font-family:Arial,sans-serif;font-size:14px;text-anchor:middle}
.card{fill:#142345;stroke-width:1.7}
.animated-border{fill:none;stroke-width:4;opacity:0;animation:highlight 11.55s infinite;}
.step-dot{opacity:0;animation:dot 11.55s infinite}
.animated-progress{stroke-dasharray:9 11;animation:dash 3s linear infinite}
.loop-line{stroke-dasharray:8 10;animation:dash 2s linear infinite}
@keyframes highlight{0%,13%{opacity:1;filter:drop-shadow(0 0 11px currentColor)}14%,100%{opacity:0}}
@keyframes dot{0%,13%{opacity:1;r:6}14%,100%{opacity:0;r:5}}
@keyframes dash{to{stroke-dashoffset:-42}}
@media (prefers-reduced-motion:reduce){.animated-border,.step-dot,.animated-progress,.loop-line{animation:none}.animated-border{opacity:.18}}
</style>
</defs>
